plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vivotomirpay.stub'
    compileSdk 36

    defaultConfig {
        applicationId "com.vivotomirpay.stub"
        minSdk 25
        targetSdk 35
        versionCode 133
        versionName "1.3.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Подпись release-сборки. Пароли можно задать через переменные окружения или
    // через ~/.gradle/gradle.properties (vvtmKeystorePassword / vvtmKeyPassword).
    // Если переменные не заданы, используется стандартный Android debug-ключ
    // (~/.android/debug.keystore) — этого достаточно для локальной сборки и
    // самостоятельной установки APK.
    signingConfigs {
        release {
            // Используем стандартный debug-ключ по умолчанию, лежащий в ~/.android/debug.keystore.
            // Это самый честный fallback: тот же ключ, что Android Studio использует для debug.
            def defaultStore = new File(System.getProperty("user.home"), ".android/debug.keystore")
            storeFile file(System.env.VVTM_KEYSTORE ?: defaultStore.absolutePath)
            storePassword System.env.VVTM_KEYSTORE_PASSWORD ?: "android"
            keyAlias System.env.VVTM_KEY_ALIAS ?: "androiddebugkey"
            keyPassword System.env.VVTM_KEY_PASSWORD ?: "android"
        }
    }

    buildTypes {
        debug {
            // Debug-сборка по умолчанию подписывается debug-ключом — ничего не меняем.
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // HiddenApiBypass — библиотека от LSPosed, которая снимает блокировку @hide API
    // на Android P+. Без неё reflection на IVoiceInteractionManagerService.showSessionFromSession
    // падает с NoSuchMethodException. Аналогично работает сам MiCTS / VISTrigger.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
